name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS arm64 release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ./packaging/macos/build.sh
      - run: |
          dist/dlp/dlp --version
          dist/dlp/dlp doctor --ui-check
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/dlp-macos-arm64.pkg
          if-no-files-found: error

  windows:
    name: Windows x64 release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - shell: pwsh
        run: choco install innosetup --yes --no-progress
      - shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          .\packaging\windows\build.ps1
          .\dist\dlp\dlp.exe --version
          .\dist\dlp\dlp.exe doctor --ui-check
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/dlp-windows-x64-setup.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create checksum manifest
        shell: bash
        run: |
          find release-assets -type f -maxdepth 3 -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DLP ${GITHUB_REF_NAME}" \
            --generate-notes \
            release-assets/release-macos/dlp-macos-arm64.pkg \
            release-assets/release-windows/dlp-windows-x64-setup.exe \
            release-assets/SHA256SUMS.txt
