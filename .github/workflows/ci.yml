name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Run mypy
        run: python -m mypy src/dlp --show-error-codes

  windows-package:
    name: Windows x64 package
    runs-on: windows-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows x64 artifacts
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          .\packaging\windows\build.ps1
      - name: Smoke test bundled CLI
        shell: pwsh
        run: |
          .\dist\dlp\dlp.exe --version
          .\dist\dlp\dlp.exe --help
          .\dist\dlp\dlp.exe doctor --ui-check
          if (-not (Test-Path .\dist\dlp\_internal\licenses\MANIFEST.txt)) { throw "License manifest missing" }
          python packaging/smoke_frozen.py .\dist\dlp\dlp.exe
      - name: Install and smoke test Windows installer
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "dlp-installed"
          $installer = (Resolve-Path .\dist\dlp-windows-x64-setup.exe).Path
          $installLog = Join-Path $env:RUNNER_TEMP "dlp-install.log"
          $installResult = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/LOG=$installLog",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($installResult.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog }
            throw "Installer exited with code $($installResult.ExitCode)"
          }
          $installedBinary = Join-Path $installDir "dlp.exe"
          if (-not (Test-Path $installedBinary)) {
            if (Test-Path $installLog) { Get-Content $installLog }
            Get-ChildItem (Split-Path $installDir) -Force | Format-Table -AutoSize | Out-String | Write-Host
            throw "Installer did not place dlp.exe in $installDir"
          }
          & $installedBinary --version
          python packaging/smoke_frozen.py $installedBinary
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $normalizedInstall = $installDir.TrimEnd("\")
          if (-not (($userPath -split ";") | Where-Object { $_.TrimEnd("\") -ieq $normalizedInstall })) {
            throw "Installer did not add its directory to the current-user PATH"
          }
          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          & $uninstaller.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if (Test-Path $installDir) { throw "Installer directory remained after uninstall" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") | Where-Object { $_.TrimEnd("\") -ieq $normalizedInstall }) {
            throw "Uninstaller left its directory in the current-user PATH"
          }
          $hash = (Get-FileHash .\dist\dlp-windows-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  dlp-windows-x64-setup.exe" | Out-File .\dist\SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dlp-windows-x64
          path: |
            dist/dlp-windows-x64-setup.exe
            dist/dlp
            dist/SHA256SUMS.txt
          if-no-files-found: error

  macos-package:
    name: macOS arm64 package
    runs-on: macos-14
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Build macOS arm64 artifact
        run: ./packaging/macos/build.sh
      - name: Smoke test frozen app
        run: |
          dist/dlp/dlp --version
          dist/dlp/dlp doctor --ui-check
          test -s dist/dlp/_internal/licenses/MANIFEST.txt
          python packaging/smoke_frozen.py dist/dlp/dlp
          shasum -a 256 dist/dlp-macos-arm64.pkg > dist/SHA256SUMS.txt
      - name: Install and smoke test macOS package
        run: |
          set -euo pipefail
          cleanup() {
            sudo pkgutil --forget com.dlp.cli >/dev/null 2>&1 || true
            sudo rm -f /usr/local/bin/dlp
            sudo rm -rf /usr/local/libexec/dlp
          }
          trap cleanup EXIT
          sudo installer -pkg dist/dlp-macos-arm64.pkg -target /
          /usr/local/bin/dlp --version
          test -s /usr/local/libexec/dlp/_internal/licenses/MANIFEST.txt
          python packaging/smoke_frozen.py /usr/local/libexec/dlp/dlp
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dlp-macos-arm64
          path: |
            dist/dlp-macos-arm64.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
