[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp"
version = "0.2.0"
description = "A clean terminal UI and CLI for yt-dlp downloads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "platformdirs>=4.2",
  "textual>=0.50",
  "tomli-w>=1.0",
  "yt-dlp[default]>=2026.7.4",
  "yt-dlp-ejs>=0.3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pyinstaller>=6.8",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
dlp = "dlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dlp.ui" = ["*.tcss"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
